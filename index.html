<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Joyeux anniversaire Emiliano</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Fundo: luzes carmim e veludo + canvas artístico (pétalas + coração paramétrico + fogos) -->
  <div class="blobs" aria-hidden="true"><i></i><i></i><i></i></div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <canvas id="burstCanvas" aria-hidden="true"></canvas>

  <!-- Capa com Envelope Vetorial e Lacre de Cera -->
  <div id="cover" class="glass">
    <button class="envelope" id="open" aria-label="Ouvrir la lettre">
      <svg viewBox="0 0 120 88" width="128" height="94" fill="none">
        <rect x="4" y="4" width="112" height="80" rx="8" fill="rgba(110, 17, 41, 0.55)" stroke="#e8c79b" stroke-width="1.6"/>
        <path d="M6 6 L60 48 L114 6" stroke="#e8c79b" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M6 82 L44 46 M114 82 L76 46" stroke="rgba(232, 199, 155, 0.45)" stroke-width="1.2"/>
        <!-- Lacre de cera carmim -->
        <circle cx="60" cy="48" r="15" fill="#9e1938" stroke="#e8c79b" stroke-width="1.4"/>
        <path d="M60 55 C60 55 51 49.5 51 44.5 C51 42 53 40.5 55.2 40.5 C57 40.5 58.8 41.6 60 43.2 C61.2 41.6 63 40.5 64.8 40.5 C67 40.5 69 42 69 44.5 C69 49.5 60 55 60 55 Z" fill="#e8c79b"/>
      </svg>
    </button>
    <p class="eyebrow" data-i="coverT"></p>
    <button class="btn" id="open2" data-i="coverB"></button>
  </div>

  <!-- Barra fixa: música (SVG) + idioma -->
  <nav id="bar">
    <button class="glass icon-btn" id="mus" aria-label="Musique">
      <svg id="musIcon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l12-2v13"/>
        <circle cx="6" cy="18" r="3"/>
        <circle cx="18" cy="16" r="3"/>
      </svg>
    </button>
    <button class="glass" id="lang">EN</button>
  </nav>
  <div id="yt" aria-hidden="true" style="position:fixed;left:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none"></div>
  <audio id="bgm" src="audio/musica.mp3" loop></audio>
  <audio id="song" src="audio/parabens-fr.mp3"></audio>

  <!-- 1. Início -->
  <header id="hero" class="wrap">
    <p class="eyebrow" data-i="heroS"></p>
    <h1>Emiliano</h1>
    <div id="age">22</div>
    <p class="eyebrow" data-i="heroH"></p>
    <div class="french-ornament" aria-hidden="true">
      <svg viewBox="0 0 180 20" width="160" height="18" fill="none">
        <line x1="10" y1="10" x2="72" y2="10" stroke="#e8c79b" stroke-opacity="0.55" stroke-width="1"/>
        <path d="M90 16 C90 16 82 11 82 6.8 C82 4.6 83.8 3.2 85.8 3.2 C87.4 3.2 89 4.2 90 5.6 C91 4.2 92.6 3.2 94.2 3.2 C96.2 3.2 98 4.6 98 6.8 C98 11 90 16 90 16 Z" fill="#d9385a"/>
        <line x1="108" y1="10" x2="170" y2="10" stroke="#e8c79b" stroke-opacity="0.55" stroke-width="1"/>
      </svg>
    </div>
    <p class="muted" id="cd"></p>
  </header>

  <!-- 2. Carta + Dois Cupidos Vetoriais + Paisagem Countryside Francesa -->
  <section class="wrap">
    <h2 data-i="letterH"></h2>
    <div class="letter-row">
      <!-- Cupido Esquerdo -->
      <button class="cupid left" id="cupidL" aria-label="Cupidon gauche">
        <svg viewBox="0 0 110 120" width="88" height="96">
          <ellipse cx="52" cy="24" rx="14" ry="4" fill="none" stroke="#e8c79b" stroke-width="1.8"/>
          <path class="wing" d="M40 52 C14 32, 6 58, 36 68" fill="rgba(232,199,155,0.18)" stroke="#e8c79b" stroke-width="1.5"/>
          <path class="wing" d="M36 62 C12 52, 14 78, 38 78" fill="rgba(232,199,155,0.12)" stroke="#e8c79b" stroke-width="1.3"/>
          <circle cx="54" cy="40" r="11" fill="#e8c79b"/>
          <path d="M46 52 Q54 78 48 92 M56 54 Q66 74 62 90" stroke="#e8c79b" stroke-width="5.5" stroke-linecap="round" fill="none"/>
          <path d="M74 34 Q96 58 74 82" fill="none" stroke="#d9385a" stroke-width="2.4"/>
          <line x1="74" y1="34" x2="74" y2="82" stroke="#e8c79b" stroke-width="1" stroke-dasharray="2 2"/>
          <line x1="56" y1="58" x2="98" y2="58" stroke="#e8c79b" stroke-width="1.8"/>
          <polygon points="103,58 95,53 95,63" fill="#d9385a"/>
        </svg>
      </button>

      <article class="glass letter" id="letter-box">
        <div id="letter"></div>
        <!-- Paisagem Countryside da França -->
        <div class="countryside-art" aria-hidden="true">
          <svg viewBox="0 0 600 110" preserveAspectRatio="none">
            <defs>
              <linearGradient id="sunGlow" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#e8c79b" stop-opacity="0.5"/>
                <stop offset="100%" stop-color="#9e1938" stop-opacity="0"/>
              </linearGradient>
              <linearGradient id="hill1" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#470e21" stop-opacity="0.75"/>
                <stop offset="100%" stop-color="#6e1631" stop-opacity="0.75"/>
              </linearGradient>
              <linearGradient id="vineyard" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#871936" stop-opacity="0.55"/>
                <stop offset="100%" stop-color="#260610" stop-opacity="0.95"/>
              </linearGradient>
            </defs>
            <circle cx="460" cy="46" r="26" fill="url(#sunGlow)"/>
            <path d="M0,78 Q150,42 320,74 T600,62 L600,110 L0,110 Z" fill="url(#hill1)"/>
            <path d="M125,64 Q130,36 135,64 Z M144,62 Q149,30 154,62 Z M415,68 Q420,40 425,68 Z" fill="#21050e"/>
            <path d="M0,92 Q180,68 360,90 T600,80 L600,110 L0,110 Z" fill="url(#vineyard)"/>
            <path d="M0,102 Q220,84 440,100 T600,94 L600,110 L0,110 Z" fill="#160409"/>
          </svg>
          <span class="countryside-tag">Douce Campagne Française</span>
        </div>
      </article>

      <!-- Cupido Direito -->
      <button class="cupid right" id="cupidR" aria-label="Cupidon droit">
        <svg viewBox="0 0 110 120" width="88" height="96">
          <ellipse cx="58" cy="24" rx="14" ry="4" fill="none" stroke="#e8c79b" stroke-width="1.8"/>
          <path class="wing" d="M70 52 C96 32, 104 58, 74 68" fill="rgba(232,199,155,0.18)" stroke="#e8c79b" stroke-width="1.5"/>
          <path class="wing" d="M74 62 C98 52, 96 78, 72 78" fill="rgba(232,199,155,0.12)" stroke="#e8c79b" stroke-width="1.3"/>
          <circle cx="56" cy="40" r="11" fill="#e8c79b"/>
          <path d="M64 52 Q56 78 62 92 M54 54 Q44 74 48 90" stroke="#e8c79b" stroke-width="5.5" stroke-linecap="round" fill="none"/>
          <path d="M36 34 Q14 58 36 82" fill="none" stroke="#d9385a" stroke-width="2.4"/>
          <line x1="36" y1="34" x2="36" y2="82" stroke="#e8c79b" stroke-width="1" stroke-dasharray="2 2"/>
          <line x1="54" y1="58" x2="12" y2="58" stroke="#e8c79b" stroke-width="1.8"/>
          <polygon points="7,58 15,53 15,63" fill="#d9385a"/>
        </svg>
      </button>
    </div>
  </section>

  <!-- 3. Gráfico Financeiro do Amor ("La Bourse de Notre Amour") -->
  <section class="wrap">
    <h2 data-i="finH"></h2>
    <p class="muted" data-i="finS"></p>
    <div class="glass finance-box">
      <div class="finance-kpis">
        <div class="kpi">
          <span class="kpi-label" data-i="kpi1L"></span>
          <strong class="kpi-val">+∞ %</strong>
        </div>
        <div class="kpi">
          <span class="kpi-label" data-i="kpi2L"></span>
          <strong class="kpi-val">22 ANS</strong>
        </div>
        <div class="kpi">
          <span class="kpi-label" data-i="kpi3L"></span>
          <strong class="kpi-val">100 %</strong>
        </div>
      </div>
      <canvas id="loveChart" aria-label="Courbe de notre amour"></canvas>
    </div>
  </section>

  <!-- 4. Parabéns em francês + Visualizador de Frequência -->
  <section class="wrap">
    <h2 data-i="songH"></h2>
    <div class="glass song">
      <canvas id="wave" aria-hidden="true"></canvas>
      <div id="lyrics"></div>
      <button class="btn icon-label-btn" id="sing">
        <span data-i="songB"></span>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>
    </div>
  </section>

  <!-- 5. Galeria Parisiense com Efeito Vidro Fosco (Blur) -->
  <section class="wrap">
    <h2 data-i="galH"></h2>
    <div class="carousel glass" id="carousel">
      <div class="viewport"><div class="track" id="track"></div></div>
      <button class="nav prev" id="prev" aria-label="Précédent">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button class="nav next" id="next" aria-label="Suivant">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
    <div class="dots" id="dots"></div>
  </section>

  <!-- 6. Baralho de Motivos -->
  <section class="wrap">
    <h2 data-i="reasH"></h2>
    <p class="muted" data-i="reasS"></p>
    <div class="cards" id="cards"></div>
  </section>

  <!-- 7. Desejo + Bolo de Aniversário Interativo com Velas -->
  <section class="wrap" id="wish">
    <h2 data-i="wishH"></h2>
    <p class="muted" data-i="wishP"></p>
    <div class="cake-stage">
      <canvas id="cakeCanvas" width="320" height="250" aria-label="Gâteau d'anniversaire"></canvas>
    </div>
    <button class="btn icon-label-btn" id="wishBtn">
      <span id="wishBtnText" data-i="wishB"></span>
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2c1.5 2.2 2.5 3.8 2.5 5.2a2.5 2.5 0 0 1-5 0C9.5 5.8 10.5 4.2 12 2z"/>
        <rect x="9" y="11" width="6" height="11" rx="1"/>
      </svg>
    </button>
    <p id="wishMsg"></p>
  </section>

  <footer>
    <span data-i="foot"></span>
    <svg viewBox="0 0 24 24" width="14" height="14" fill="#d9385a" style="vertical-align:-2px;margin-left:6px">
      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
    </svg>
  </footer>

  <div id="lb"><img alt=""></div>

  <script src="script.js"></script>
</body>
</html>
